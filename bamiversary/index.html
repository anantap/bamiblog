<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>bamiversary · bami.blog</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="map-page" aria-busy="true">
      <h1 class="map-title"><a href="/"><img src="/lettering/bamiversary.svg" alt="bamiversary, back to the noodles" width="556" height="203" /></a></h1>
      <dl class="facts" id="facts">
        <div><dt>time</dt><dd>1 year.</dd></div>
      </dl>
      <nav class="tabs" id="modes">
        <button type="button" data-mode="made" aria-current="page">made in</button>
        <button type="button" data-mode="eaten">eaten in</button>
      </nav>
      <div class="map" id="map"></div>
      <p class="map-summary" id="summary"></p>
      <section id="country" hidden>
        <h2 class="map-country" id="country-name"></h2>
        <div class="map-list" id="country-list"></div>
      </section>
    </main>

    <script type="module" src="/src/map.js"></script>
  </body>
</html>
