<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>bamiversary · bami.blog</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="map-page" aria-busy="true">
      <h1 class="map-title"><a href="/"><img class="the" src="/lettering/the.svg" alt="the" width="166" height="137" /><img src="/lettering/bamiversary.svg" alt="bamiversary, back to the noodles" width="541" height="192" /></a></h1>
      <dl class="facts" id="facts">
        <div><dt>time</dt><dd>1 year.</dd></div>
      </dl>
      <figure class="clock" id="clock" hidden>
        <div class="clock-chart" id="clock-chart"></div>
        <figcaption id="clock-caption"></figcaption>
      </figure>
      <div class="map" id="map"></div>
      <p class="map-summary" id="summary"></p>
      <nav class="tabs map-countries" id="countries" aria-label="Show a country on the map"></nav>
      <div id="groups"></div>
    </main>

    <script type="module" src="/src/map.js"></script>
  </body>
</html>
