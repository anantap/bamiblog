<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>bamiversary · bami.blog</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- On a phone's home screen: the favicon on white, opening full screen like an app. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="bami.blog" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
    <!-- The intro plays once its images are in (src/map.js); without script, or with less motion asked for, it doesn't. -->
    <script>
      if (!matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.classList.add("intro-on");
    </script>
  </head>
  <body>
    <main class="map-page" aria-busy="true">
      <!-- Each part fills most of the screen, with the edges of the parts around it showing. -->
      <!-- The intro: white fades to red with the title in white, then flips to white with the title in red. -->
      <div class="intro" aria-hidden="true">
        <div class="intro-title"><img class="the" src="/lettering/the.svg" alt="" width="166" height="137" /><img src="/lettering/bamiversary.svg" alt="" width="541" height="192" /></div>
      </div>
      <header class="panel panel-intro">
        <h1 class="map-title"><a href="/"><img class="the" src="/lettering/the.svg" alt="the" width="166" height="137" /><img src="/lettering/bamiversary.svg" alt="bamiversary, back to the noodles" width="541" height="192" /></a></h1>
      </header>
      <!-- The story: pack #1, then a sentence ahead of each part (src/story.js). -->
      <section class="panel chapter" id="day-one" hidden>
        <p class="story" id="story-start"></p>
        <img class="chapter-photo" id="first-photo" alt="" />
        <p class="panel-sub" id="first-number"></p>
      </section>
      <section class="panel panel-grow">
        <p class="story" id="story-map"></p>
        <p class="map-summary" id="summary"></p>
        <div class="map" id="map"></div>
      </section>
      <section class="panel panel-grow" id="brands-panel" hidden>
        <p class="story" id="story-brands"></p>
        <div class="brands" id="brands"></div>
      </section>
      <section class="panel" id="estate-panel" hidden>
        <p class="story" id="story-estate"></p>
        <div class="chart" id="estate"></div>
      </section>
      <section class="panel panel-grow" id="length-panel" hidden>
        <p class="story" id="story-meters"></p>
        <div class="length" id="length"></div>
      </section>
      <section class="panel" id="soup-panel" hidden>
        <p class="story" id="story-soup"></p>
        <div class="cooling-holder" id="cooling"></div>
      </section>
      <section class="panel panel-grow every" id="every" hidden>
        <p class="story" id="story-every"></p>
        <div class="every-grid"></div>
      </section>
    </main>

    <script type="module" src="/src/map.js"></script>
  </body>
</html>
