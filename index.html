<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bami.blog</title>
    <meta name="description" content="A logbook of instant noodles." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍜</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="top">
      <a class="logo" href="/"><img src="/logo.svg" alt="bami.blog" width="361" height="173" /></a>
      <nav class="nav">
        <a id="add-link" href="/add/" hidden>+ ADD</a>
        <button id="about-open" type="button">ABOUT</button>
      </nav>
    </header>

    <main id="grid" class="grid" aria-busy="true"></main>

    <dialog id="detail" class="sheet"></dialog>

    <dialog id="about" class="sheet about">
      <p>A logbook of instant noodles.</p>
      <p>Every pack gets a photo, a number and a rating out of five. Inspired by <a href="https://nice.rocks/">nice.rocks</a>.</p>
      <form method="dialog"><button class="close">CLOSE</button></form>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
