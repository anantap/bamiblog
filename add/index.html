<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Add · bami.blog</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="top">
      <a class="logo" href="/"><img src="/logo.svg" alt="bami.blog" width="361" height="173" /></a>
      <nav class="nav">
        <button id="logout" type="button" hidden>LOG OUT</button>
      </nav>
    </header>

    <main class="form-page">
      <form id="login" class="stack" hidden>
        <label>Password <input name="password" type="password" autocomplete="current-password" required /></label>
        <button type="submit">LOG IN</button>
        <p class="error" role="alert"></p>
      </form>

      <form id="entry" class="stack" hidden>
        <div class="photo-field">
          <label class="photo-picker" id="picker">
            <span>TAP TO ADD PHOTO</span>
            <input name="photo" type="file" accept="image/*" capture="environment" required />
          </label>
          <div class="cropper" id="cropper" hidden>
            <canvas aria-label="Photo crop. Drag to move, pinch or scroll to zoom."></canvas>
            <div class="guide"></div>
          </div>
          <div class="crop-tools" id="crop-tools" hidden>
            <input id="zoom" type="range" min="1" max="5" step="0.01" value="1" aria-label="Zoom" />
            <button id="new-photo" type="button">NEW PHOTO</button>
          </div>
          <p class="hint" id="crop-hint" hidden>Drag and zoom until the pack fills the frame.</p>
        </div>
        <label>Brand <input name="brand" maxlength="60" required placeholder="Indomie" /></label>
        <label>Flavour <input name="flavour" maxlength="80" placeholder="Mi Goreng" /></label>
        <label>Country <select name="country"><option value="">—</option></select></label>
        <fieldset class="rating">
          <legend>Rating</legend>
          <label><input type="radio" name="rating" value="1" required /><span>1</span></label>
          <label><input type="radio" name="rating" value="2" /><span>2</span></label>
          <label><input type="radio" name="rating" value="3" /><span>3</span></label>
          <label><input type="radio" name="rating" value="4" /><span>4</span></label>
          <label><input type="radio" name="rating" value="5" /><span>5</span></label>
        </fieldset>
        <label>Note <textarea name="note" maxlength="280" rows="3" placeholder="added an egg"></textarea></label>
        <label>Date <input name="date" type="date" required /></label>
        <button type="submit">SAVE</button>
        <p class="error" role="alert"></p>
      </form>
    </main>

    <script type="module" src="/src/add.js"></script>
  </body>
</html>
