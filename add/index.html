<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Add · bami.blog</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="top">
      <a class="logo" href="/"><img src="/logo-bb.svg" alt="bami.blog" width="130" height="117" /></a>
    </header>

    <main class="form-page">
      <form id="login" class="stack" hidden>
        <label>Password <input name="password" type="password" autocomplete="current-password" required /></label>
        <button type="submit">Log in</button>
        <p class="error" role="alert"></p>
      </form>

      <nav class="tabs" id="tabs" hidden>
        <button type="button" data-tab="noodle" aria-current="page">noodle</button>
        <button type="button" data-tab="mail">mail</button>
      </nav>

      <form id="entry" class="stack" hidden>
        <div class="photo-field">
          <label class="photo-picker" id="picker">
            <span>Tap to add a photo</span>
            <input name="photo" type="file" accept="image/*" required />
          </label>
          <div class="cropper" id="cropper" hidden>
            <canvas tabindex="0" aria-label="Photo. Drag to move; pinch, scroll or press + and − to zoom."></canvas>
            <div class="guide"></div>
          </div>
          <div class="crop-tools" id="crop-tools" hidden>
            <p class="hint">Drag and pinch until the pack touches the dashed square.</p>
            <button id="new-photo" type="button">New photo</button>
          </div>
        </div>
        <label>Brand <input name="brand" maxlength="60" required placeholder="Indomie" /></label>
        <label>Flavour <input name="flavour" maxlength="80" placeholder="Mi Goreng" /></label>
        <label>Country <select name="country"><option value="">—</option></select></label>
        <fieldset class="rating">
          <legend>Rating</legend>
          <label><input type="radio" name="rating" value="1" required /><span>1</span></label>
          <label><input type="radio" name="rating" value="2" /><span>2</span></label>
          <label><input type="radio" name="rating" value="3" /><span>3</span></label>
          <label><input type="radio" name="rating" value="4" /><span>4</span></label>
          <label><input type="radio" name="rating" value="5" /><span>5</span></label>
        </fieldset>
        <label>Review <textarea name="review" maxlength="2000" rows="6" placeholder="for the weekly email"></textarea></label>
        <label>Location <input name="place" maxlength="80" placeholder="The Hague, NL" autocapitalize="words" /></label>
        <label>Date <input name="date" type="date" required /></label>
        <button type="submit">Save</button>
        <p class="error" role="alert"></p>
      </form>
      <section id="mail" hidden>
        <form id="extra" class="stack">
          <div class="photo-field">
            <label class="photo-picker" id="extra-picker">
              <span>Tap to add an image</span>
              <input name="image" type="file" accept="image/*" required />
            </label>
            <img class="extra-preview" id="extra-preview" alt="" hidden />
            <div class="crop-tools" id="extra-tools" hidden>
              <label class="check"><input name="video" type="checkbox" /> It's a video: add a play button</label>
              <button id="extra-new" type="button">New image</button>
            </div>
          </div>
          <label>Link <input name="link" type="url" inputmode="url" placeholder="https://www.threads.com/…" /></label>
          <label>Caption <input name="caption" maxlength="120" required value="Monday mood" /></label>
          <label>Via <input name="credit" maxlength="60" placeholder="Pieter" /></label>
          <label>Via link <input name="creditUrl" type="url" inputmode="url" placeholder="https://…" /></label>
          <p class="hint">One goes at the end of each Monday email, oldest first.</p>
          <button type="submit">Add to the mail</button>
          <p class="error" role="alert"></p>
        </form>
        <ol class="queue" id="queue"></ol>
      </section>
    </main>

    <script type="module" src="/src/add.js"></script>
  </body>
</html>
